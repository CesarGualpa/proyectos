spring.application.name=proyectos

spring.datasource.url=jdbc:postgresql://localhost:5432/proyectos_db
spring.datasource.username=${PROYECTOS_DB_USER}
spring.datasource.password=${PROYECTOS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${PROYECTOS_JWT_SECRET}
jwt.expiration-ms=1800000